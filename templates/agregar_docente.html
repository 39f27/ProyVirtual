
{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Registrar Nuevo Docente</h2>
    <form method="POST" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Nombre del Docente</label>
            <input type="text" name="nombre" class="form-control" placeholder="Ej. Prof. Juan Pérez" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Correo Electrónico (Opcional)</label>
            <input type="email" name="correo" class="form-control" placeholder="juan.perez@ucla.edu.ve">
        </div>
        <button type="submit" class="btn btn-success">Guardar Docente</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
